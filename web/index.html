<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Pigeon Seatbelt</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- The seatbelt warning light: a seated figure with the belt across them. Drawn by Pigeon Studios. -->
    <div id="indicator" class="indicator" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
            <circle cx="30" cy="12" r="6" />
            <path d="M24 22 h10 a6 6 0 0 1 6 6 v12 h10 a4 4 0 0 1 4 4 v12 h-8 v-8 h-16 a6 6 0 0 1 -6 -6 z" />
            <path class="belt" d="M22 24 L44 50" />
            <rect x="14" y="20" width="6" height="34" rx="3" />
        </svg>
    </div>
    <script src="app.js"></script>
</body>
</html>
